<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Border Gradient -->
    <linearGradient id="logoBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066fe" />
      <stop offset="50%" stop-color="#0044b3" />
      <stop offset="100%" stop-color="#001f66" />
    </linearGradient>

    <!-- Blue Theme Gradient for Gear & Book -->
    <linearGradient id="blueGearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0062e6" />
      <stop offset="100%" stop-color="#003599" />
    </linearGradient>

    <linearGradient id="bookPageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080ff" />
      <stop offset="100%" stop-color="#0040b3" />
    </linearGradient>

    <!-- Inner Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background White Rounded Card with Deep Blue Frame -->
  <rect x="20" y="20" width="460" height="460" rx="85" ry="85" fill="#ffffff" stroke="url(#logoBorderGrad)" stroke-width="18" filter="url(#softShadow)" />

  <!-- CENTER EMBLEM GROUP -->
  <g transform="translate(250, 190)">

    <!-- 1. Mechanical Gear (Background) -->
    <g fill="url(#blueGearGrad)">
      <!-- Gear Center Outer Ring -->
      <path d="M 0 -105 
               L 12 -105 L 16 -88 A 95 95 0 0 1 45 -76 L 60 -85 L 75 -70 L 66 -55 A 95 95 0 0 1 78 -26 L 95 -22 L 95 0 
               L 95 22 L 78 26 A 95 95 0 0 1 66 55 L 75 70 L 60 85 L 45 76 A 95 95 0 0 1 16 88 L 12 105 L -12 105 
               L -16 88 A 95 95 0 0 1 -45 76 L -60 85 L -75 70 L -66 55 A 95 95 0 0 1 -78 26 L -95 22 L -95 0 
               L -95 -22 L -78 -26 A 95 95 0 0 1 -66 -55 L -75 -70 L -60 -85 L -45 -76 A 95 95 0 0 1 -16 -88 Z" />
      <circle cx="0" cy="0" r="68" fill="#ffffff" />
    </g>

    <!-- 2. Circuit Board Traces (Left Side inside Gear) -->
    <g stroke="#0062e6" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -45 -20 L -30 -20 L -20 -35" />
      <path d="M -52 0 L -32 0" />
      <path d="M -48 20 L -28 20 L -18 35" />
      <circle cx="-45" cy="-20" r="3.5" fill="#0062e6" />
      <circle cx="-52" cy="0" r="3.5" fill="#0062e6" />
      <circle cx="-48" cy="20" r="3.5" fill="#0062e6" />
    </g>

    <!-- 3. Robotic Manipulator Arm (Top Right) -->
    <g fill="#0052cc" stroke="#003599" stroke-width="1.5">
      <!-- Base Joint -->
      <circle cx="10" cy="-35" r="9" fill="#003599" />
      <!-- Lower Arm Link -->
      <path d="M 8 -35 L -10 -65 L -3 -70 L 15 -40 Z" />
      <!-- Elbow Joint -->
      <circle cx="-6" cy="-68" r="7" fill="#0062e6" />
      <!-- Upper Arm Link -->
      <path d="M -6 -68 L 22 -50 L 25 -43 L -3 -61 Z" />
      <!-- Wrist & Gripper Claw -->
      <circle cx="23" cy="-46" r="5" fill="#003599" />
      <path d="M 23 -46 L 25 -32 M 19 -30 L 25 -32 L 23 -24" stroke-width="3" fill="none" />
      <path d="M 23 -46 L 31 -32 M 35 -30 L 31 -32 L 33 -24" stroke-width="3" fill="none" />
    </g>

    <!-- 4. Microchip / IC (Right Side) -->
    <g transform="translate(30, -5)">
      <rect x="-16" y="-16" width="32" height="32" rx="4" fill="#003599" stroke="#0062e6" stroke-width="2" />
      <rect x="-10" y="-10" width="20" height="20" fill="none" stroke="#66a3ff" stroke-width="1.5" />
      <!-- Pins -->
      <path d="M -12 -20 L -12 -16 M -4 -20 L -4 -16 M 4 -20 L 4 -16 M 12 -20 L 12 -16
               M -12 16 L -12 20 M -4 16 L -4 20 M 4 16 L 4 20 M 12 16 L 12 20
               M -20 -12 L -16 -12 M -20 -4 L -16 -4 M -20 4 L -16 4 M -20 12 L -16 12
               M 16 -12 L 20 -12 M 16 -4 L 20 -4 M 16 4 L 20 4 M 16 12 L 20 12" stroke="#003599" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- 5. Open Book Pages (Base Layer) -->
    <g fill="url(#bookPageGrad)" filter="url(#softShadow)">
      <!-- Left Page -->
      <path d="M 0 32 C -35 22, -80 30, -115 48 C -110 18, -60 8, 0 25 Z" />
      <path d="M 0 25 C -35 15, -80 22, -115 40 L -115 48 C -80 30, -35 22, 0 32 Z" fill="#00a0ff" opacity="0.8" />
      <!-- Right Page -->
      <path d="M 0 32 C 35 22, 80 30, 115 48 C 110 18, 60 8, 0 25 Z" />
      <path d="M 0 25 C 35 15, 80 22, 115 40 L 115 48 C 80 30, 35 22, 0 32 Z" fill="#00a0ff" opacity="0.8" />
      <!-- Spine Center -->
      <path d="M -3 20 L 0 35 L 3 20 Z" fill="#002266" />
    </g>

    <!-- 6. Curved Accent Bands / Swooshes (Under Book) -->
    <g transform="translate(0, 48)">
      <!-- Red Ribbon -->
      <path d="M -100 8 C -50 28, 50 28, 100 8 C 70 20, -70 20, -100 8 Z" fill="#e61919" />
      <!-- Black/Dark Ribbon -->
      <path d="M -110 16 C -50 38, 50 38, 110 16 C 80 28, -80 28, -110 16 Z" fill="#0f172a" />
      <!-- Blue Ribbon Arc -->
      <path d="M -125 5 C -60 -10, 60 -10, 125 5 C 100 20, -100 20, -125 5 Z" fill="#0052cc" opacity="0.9" />
    </g>

  </g>

  <!-- ARABIC BRANDING TYPOGRAPHY (BOTTOM SECTION) -->
  <g text-anchor="middle" font-family="'Cairo', 'Tajawal', 'Arial', sans-serif">
    
    <!-- Word 1: "أكاديمية" -->
    <text x="250" y="340" font-size="38" font-weight="900" fill="#003599" letter-spacing="1">أكـاديـمـيـة</text>

    <!-- Word 2: "الميكاترونكس اليمنية" -->
    <text x="250" y="395" font-size="36" font-weight="900" fill="#0062e6" letter-spacing="0">الميكاترونكس اليمنية</text>

    <!-- Divider Lines & Tagline -->
    <g transform="translate(250, 430)">
      <line x1="-190" y1="-6" x2="-140" y2="-6" stroke="#0062e6" stroke-width="3" stroke-linecap="round" />
      <text x="0" y="0" font-size="18" font-weight="800" fill="#1e293b">تعلم الميكاترونكس بطريقة أسهل</text>
      <line x1="140" y1="-6" x2="190" y2="-6" stroke="#0062e6" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>

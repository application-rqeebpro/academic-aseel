    <script>
      (function() {
        // Filter out Vite HMR WebSocket connection logs in iframe dev environment
        const origWarn = console.warn;
        const origError = console.error;
        console.warn = function(...args) {
          if (args[0] && typeof args[0] === 'string' && args[0].includes('[vite]')) return;
          origWarn.apply(console, args);
        };
        console.error = function(...args) {
          if (args[0] && typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('WebSocket') || args[0].includes('vite-hmr'))) return;
          origError.apply(console, args);
        };

        // Safe alert replacement for iFrame sandbox environment
        window.alert = function(message) {
          try {
            let container = document.getElementById('applet-toast-container');
            if (!container) {
              container = document.createElement('div');
              container.id = 'applet-toast-container';
              container.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:8px;max-width:90vw;width:400px;pointer-events:none;';
              document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.style.cssText = 'background:#0f172a;color:#f8fafc;padding:12px 18px;border-radius:12px;font-size:13px;font-family:sans-serif;box-shadow:0 10px 25px -5px rgba(0,0,0,0.3);border:1px solid #334155;text-align:center;direction:rtl;pointer-events:auto;transition:opacity 0.25s ease-out;';
            toast.textContent = String(message || '');
            container.appendChild(toast);
            setTimeout(function() {
              toast.style.opacity = '0';
              setTimeout(function() { toast.remove(); }, 300);
            }, 3500);
          } catch (err) {
            console.log('[Notice]', message);
          }
        };
      })();
    </script>
